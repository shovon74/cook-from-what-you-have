name: CI - Build and Push Docker Image

# 1. TRIGGER: Run automatically whenever code is pushed to the main branch
on:
  push:
    branches:
      - main

# Grant permission for the workflow to push packages to GitHub Container Registry
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # 2. RUNNER: Spin up a fresh Ubuntu Linux virtual machine on GitHub's servers
    runs-on: ubuntu-latest

    steps:
      # Step A: Clone your repository code onto the Ubuntu VM
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step B: Log in to GitHub Container Registry (ghcr.io) using built-in token
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step C: Build Dockerfile and push to ghcr.io/shovon74/cook-from-what-you-have
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/shovon74/cook-from-what-you-have:latest
            ghcr.io/shovon74/cook-from-what-you-have:${{ github.sha }}