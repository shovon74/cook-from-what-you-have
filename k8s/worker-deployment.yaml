apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chef-worker
  template:
    metadata:
      labels:
        app: chef-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/shovon74/cook-from-what-you-have:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "worker.py"]
          env:
            - name: DATABASE_URL
              value: "postgresql://chef_user:chef_password@db:5432/personal_chef_db"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          envFrom:
            - secretRef:
                name: chef-secrets
